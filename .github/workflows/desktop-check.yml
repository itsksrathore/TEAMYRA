name: TEAMYRA checks

on:
  push:
  pull_request:

jobs:
  foundation:
    name: Foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall bridge
      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Desktop JavaScript syntax
        run: npm run desktop:check
      - name: Build desktop renderer
        run: npm --workspace @teamyra/desktop run build:renderer
