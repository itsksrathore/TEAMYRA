name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python packager
        run: python -m pip install "pyinstaller>=6.22,<7"

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify source
        run: |
          python -m compileall bridge
          python -m unittest discover -s tests -p "test_*.py"
          npm audit --omit=dev --audit-level=high
          npm run desktop:check
          npm --workspace @teamyra/desktop run build:renderer

      - name: Build bundled core
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm teamyra-core.spec
          if (!(Test-Path "dist/teamyra-core.exe")) { throw "core build missing" }
          ./dist/teamyra-core.exe --help | Out-Null

      - name: Require signing credentials for stable tags
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "WINDOWS_CSC_LINK is required for stable v* releases"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "WINDOWS_CSC_KEY_PASSWORD is required for stable v* releases"
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            npm version $version --workspace @teamyra/desktop --no-git-tag-version
          }
          Set-Location apps/desktop
          npx electron-builder --win nsis --publish never

      - name: Verify stable signatures
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/dist/TEAMYRA-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "signed installer not found" }
          $installerSignature = Get-AuthenticodeSignature $installer.FullName
          if ($installerSignature.Status -ne "Valid") {
            throw "installer Authenticode signature is not valid: $($installerSignature.Status)"
          }
          $appExe = "apps/desktop/dist/win-unpacked/TEAMYRA.exe"
          if (!(Test-Path $appExe)) { throw "packaged TEAMYRA.exe not found" }
          $appSignature = Get-AuthenticodeSignature $appExe
          if ($appSignature.Status -ne "Valid") {
            throw "TEAMYRA.exe Authenticode signature is not valid: $($appSignature.Status)"
          }

      - name: Publish verified stable artifacts
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem "apps/desktop/dist/TEAMYRA-Setup-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "apps/desktop/dist/*.blockmap" | Select-Object -First 1
          $latest = Get-Item "apps/desktop/dist/latest.yml" -ErrorAction SilentlyContinue
          if (-not $installer -or -not $blockmap -or -not $latest) {
            throw "stable release assets are incomplete"
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "TEAMYRA $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "failed to create GitHub Release" }
          }
          $assets = @($installer.FullName, $blockmap.FullName, $latest.FullName)
          gh release upload $tag $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "failed to upload verified release assets" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teamyra-windows-${{ github.ref_name }}
          path: |
            apps/desktop/dist/TEAMYRA-Setup-*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
